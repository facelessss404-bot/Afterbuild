<!-- Static form skeleton so Netlify can detect forms at build time -->
<html>
  <body>
    <form name="contact" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="category" />
      <textarea name="details"></textarea>
    </form>
  </body>
</html>
